name: Update Fantasy Player Data

on:
  workflow_dispatch:

  schedule:
    - cron: "17 10 * * *"
    - cron: "17 18 * * *"

permissions:
  contents: write

concurrency:
  group: dukes-player-data-update
  cancel-in-progress: false

jobs:
  update-player-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run player data updater
        run: node scripts/update-player-data.js

      - name: Preserve generated player data
        run: |
          cp data/live-player-data.json /tmp/live-player-data.json

      - name: Synchronize with latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/live-player-data.json data/live-player-data.json

      - name: Commit updated player data
        run: |
          git config user.name "Duke's FF26 Data Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/live-player-data.json

          if git diff --cached --quiet; then
            echo "No player-data changes."
            exit 0
          fi

          git commit -m "Update fantasy player data"
          git push origin HEAD:main
